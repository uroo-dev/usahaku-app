<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-fixed": "#360f00", "on-surface-variant": "#434655", "tertiary": "#943700", "surface-bright": "#faf8ff", "on-secondary-container": "#fefcff", "inverse-primary": "#b4c5ff", "secondary-fixed": "#d8e2ff", "inverse-on-surface": "#f0f0fb", "on-error-container": "#93000a", "on-primary-container": "#eeefff", "on-primary-fixed": "#00174b", "primary-container": "#2563eb", "surface-dim": "#d9d9e5", "secondary": "#0058be", "on-error": "#ffffff", "on-primary-fixed-variant": "#003ea8", "surface-container-lowest": "#ffffff", "on-surface": "#191b23", "error-container": "#ffdad6", "error": "#ba1a1a", "secondary-container": "#2170e4", "tertiary-fixed": "#ffdbcd", "primary-fixed": "#dbe1ff", "tertiary-container": "#bc4800", "on-primary": "#ffffff", "surface-tint": "#0053db", "background": "#faf8ff", "on-tertiary-fixed-variant": "#7d2d00", "surface-container-low": "#f3f3fe", "on-background": "#191b23", "inverse-surface": "#2e3039", "surface-container-highest": "#e1e2ed", "on-secondary": "#ffffff", "on-secondary-fixed": "#001a42", "primary": "#004ac6", "on-tertiary-container": "#ffede6", "on-secondary-fixed-variant": "#004395", "surface-container-high": "#e7e7f3", "secondary-fixed-dim": "#adc6ff", "primary-fixed-dim": "#b4c5ff", "outline-variant": "#c3c6d7", "tertiary-fixed-dim": "#ffb596", "surface-variant": "#e1e2ed", "on-tertiary": "#ffffff", "surface": "#faf8ff", "surface-container": "#ededf9", "outline": "#737686" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-mobile": "20px", "base": "4px", "xs": "8px", "md": "16px", "touch-target": "48px", "sm": "12px", "lg": "24px", "xl": "32px", "gutter": "16px" }, "fontFamily": { "body-md": ["Inter"], "headline-sm": ["Inter"], "headline-lg": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"], "body-lg": ["Inter"], "headline-lg-mobile": ["Inter"], "headline-md": ["Inter"], "display-lg": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-lg": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "display-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } }</script><style>@layer base { body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } } .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }</style></head><body class="bg-background font-body-md text-on-background"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-margin-mobile flex items-center justify-between"><h1 class="font-headline-md text-headline-md text-primary tracking-tight">UsahaKu</h1><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="relative pt-16 pb-24 min-h-screen bg-background"><div class="flex flex-col w-full animate-in fade-in duration-500">
<!-- Header & Context -->
<div class="px-margin-mobile py-md flex items-center justify-between">
<div class="flex flex-col">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Bayar Utang</h2>
<p class="font-body-md text-text-on-surface-variant">Catat pelunasan utang ke pemasok</p>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-high text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Debt Summary Card -->
<div class="px-margin-mobile mb-lg">
<div class="relative overflow-hidden bg-primary rounded-xl p-lg shadow-md group">
<!-- Decorative Background element -->
<div class="absolute -right-4 -top-4 w-24 h-24 bg-on-primary/10 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
<div class="relative z-10 flex flex-col gap-1">
<span class="font-label-md text-on-primary/80 uppercase tracking-wider">Sisa Utang Saat Ini</span>
<div class="flex items-baseline gap-1">
<span class="font-label-lg text-on-primary opacity-90">Rp</span>
<span class="font-display-lg text-display-lg text-on-primary">4.500.000</span>
</div>
</div>
<div class="relative z-10 mt-md flex items-center gap-2 py-xs px-sm bg-on-primary/10 rounded-lg w-fit">
<span class="material-symbols-outlined text-[16px] text-on-primary">calendar_today</span>
<span class="font-label-md text-on-primary">Jatuh tempo: 24 Sep 2023</span>
</div>
</div>
</div>
<!-- Form Fields -->
<div class="px-margin-mobile flex flex-col gap-xl pb-32">
<!-- Nominal Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-on-surface-variant ml-1">Nominal Bayar</label>
<div class="relative flex items-center">
<span class="absolute left-lg font-headline-sm text-primary">Rp</span>
<input class="w-full bg-surface-container-low h-16 rounded-xl pl-12 pr-lg font-headline-md text-headline-md text-on-surface focus:outline-none focus:bg-surface-bright focus:shadow-[0_0_0_2px_rgba(0,74,198,0.2)] transition-all placeholder:text-outline-variant" placeholder="0" type="number">
</div>
</div>
<!-- Tanggal & Metode Grid -->
<div class="grid grid-cols-1 gap-xl">
<!-- Date Picker -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-on-surface-variant ml-1">Tanggal Bayar</label>
<div class="relative">
<input class="w-full bg-surface-container-low h-14 rounded-xl px-lg font-body-lg text-on-surface appearance-none focus:outline-none focus:bg-surface-bright transition-all" type="date" value="2023-09-15">
<span class="material-symbols-outlined absolute right-lg top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_month</span>
</div>
</div>
<!-- Payment Method -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-on-surface-variant ml-1">Metode Pembayaran</label>
<div class="flex bg-surface-container-low p-1 rounded-xl gap-1">
<button class="payment-toggle flex-1 py-3 rounded-lg font-label-lg transition-all bg-surface text-primary shadow-sm" data-method="tunai">
            Tunai
          </button>
<button class="payment-toggle flex-1 py-3 rounded-lg font-label-lg transition-all text-on-surface-variant" data-method="qris">
            QRIS
          </button>
<button class="payment-toggle flex-1 py-3 rounded-lg font-label-lg transition-all text-on-surface-variant" data-method="transfer">
            Transfer
          </button>
</div>
</div>
</div>
<!-- Notes -->
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-on-surface-variant ml-1">Keterangan (Opsional)</label>
<textarea class="w-full bg-surface-container-low min-h-[100px] rounded-xl p-lg font-body-md text-on-surface focus:outline-none focus:bg-surface-bright transition-all placeholder:text-outline-variant resize-none" placeholder="Contoh: Cicilan tahap pertama"></textarea>
</div>
<!-- Visual Delight / Empty State Suggestion if no debt was found (Hidden here) -->
<div class="bg-secondary-container/30 p-lg rounded-xl flex items-start gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary">tips_and_updates</span>
</div>
<p class="font-body-md text-on-secondary-fixed-variant leading-tight">
        Mencatat pembayaran secara akurat membantu menjaga reputasi bisnismu dengan pemasok.
      </p>
</div>
</div>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-16 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background/95 to-transparent">
<button class="w-full bg-primary h-14 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-on-primary">task_alt</span>
<span class="font-label-lg text-on-primary text-body-lg">Simpan Pembayaran</span>
</button>
</div>
<script>
    // Micro-interaction for payment method toggle
    document.querySelectorAll('.payment-toggle').forEach(button => {
      button.addEventListener('click', () => {
        // Remove active states
        document.querySelectorAll('.payment-toggle').forEach(btn => {
          btn.classList.remove('bg-surface', 'text-primary', 'shadow-sm');
          btn.classList.add('text-on-surface-variant');
        });
        
        // Add active state to clicked
        button.classList.add('bg-surface', 'text-primary', 'shadow-sm');
        button.classList.remove('text-on-surface-variant');
        
        // Haptic feedback simulation
        if (window.navigator.vibrate) {
          window.navigator.vibrate(5);
        }
      });
    });

    // Simple Currency Input Masking simulation
    const amountInput = document.querySelector('input[type="number"]');
    amountInput.addEventListener('focus', () => {
        amountInput.parentElement.classList.add('scale-[1.02]');
        amountInput.parentElement.classList.transition = 'transform 0.2s ease';
    });
    amountInput.addEventListener('blur', () => {
        amountInput.parentElement.classList.remove('scale-[1.02]');
    });
  </script>
</div></main><nav class="fixed bottom-0 w-full z-50 bg-surface/80 backdrop-blur-xl pb-safe shadow-[0_-1px_8px_rgba(0,0,0,0.04)]" data-active-classes="text-primary font-semibold"></nav>

</body></html>
