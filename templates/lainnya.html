<script>
    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', function(e) {
        // Create ripple-like effect
        const circle = document.createElement('div');
        const x = e.clientX - e.target.offsetLeft;
        const y = e.clientY - e.target.offsetTop;
        
        circle.style.position = 'absolute';
        circle.style.width = '20px';
        circle.style.height = '20px';
        circle.style.borderRadius = '50%';
        circle.style.backgroundColor = 'rgba(0,0,0,0.05)';
        circle.style.left = x + 'px';
        circle.style.top = y + 'px';
        circle.style.transform = 'scale(0)';
        circle.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
        
        this.appendChild(circle);
        
        requestAnimationFrame(() => {
          circle.style.transform = 'scale(20)';
          circle.style.opacity = '0';
        });
        
        setTimeout(() => circle.remove(), 400);
      });
    });

    const calcBtn = document.getElementById('calc-trigger');
