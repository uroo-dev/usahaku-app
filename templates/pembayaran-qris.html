<script>
        (function() {
            let timeLeft = 15 * 60; // 15 minutes
            const display = document.getElementById('countdown');
            
            const timer = setInterval(() => {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                
                display.innerText = `Berlaku selama ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    display.innerText = "QR Kadaluwarsa";

                }
                timeLeft--;
            }, 1000);
        })();
