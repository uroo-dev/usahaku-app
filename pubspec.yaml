name: usahaku
description: "UsahaKu - Offline-first business management app for Indonesian UMKM"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.24.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^7.2.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true