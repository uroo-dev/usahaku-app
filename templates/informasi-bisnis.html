<!-- Hero Image Section -->
<div class="relative w-full h-64 overflow-hidden shadow-md">
<img alt="Storefront of Toko Kelontong Berkah" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBR95TX9hAAKivk4tMTTpAZPgOgCGWEtCY8kNzgymHkN5RXjVMaYhKjO5DOBD3mJ-py3yDwfsrbH5fc3muCcfJBCAKmDY9azjYe60WAKAe8BkW212EfF0J1atTFG5MsYgAv2A-p8mWj7eMl3gcjJajj-pQhtPnp0EsnYXAnm3TlidrTqBp-XFdvM6OR1ciCy0Fc74fNmhO69RRJHEps2REsPleRKO9z0cUY9apLdJDDShM59T1kZPkqbg"/>
<div class="absolute inset-0 bg-gradient-to-t from-on-background/60 via-transparent to-transparent"></div>
<!-- Change Photo FAB Overlay -->
<button class="absolute bottom-md right-margin-mobile flex items-center gap-xs bg-surface-container-lowest/90 backdrop-blur-md px-md py-sm rounded-full shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary text-[20px]">photo_camera</span>
<span class="font-label-lg text-label-lg text-on-surface">Ubah Foto</span>
</button>

<!-- Content Container -->
<div class="px-margin-mobile -mt-6 relative z-10 space-y-lg">
<!-- Informasi Dasar Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm">
<div class="flex items-center gap-sm mb-lg">
<div class="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">storefront</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Informasi Dasar</h2>
</div>
<div class="space-y-md">
<!-- Nama Bisnis -->
<div class="relative">
<label class="block font-label-md text-label-md text-outline mb-base px-base">Nama Bisnis</label>
<input class="w-full h-14 px-md bg-surface-container-low rounded-xl font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all" type="text" value="Toko Kelontong Berkah"/>
</div>
<!-- Kategori -->
<div class="relative">
<label class="block font-label-md text-label-md text-outline mb-base px-base">Kategori</label>
<div class="relative">
<input class="w-full h-14 px-md bg-surface-container-low rounded-xl font-body-lg text-body-lg text-on-surface focus:outline-none pr-10" readonly="" type="text" value="Sembako &amp; Kebutuhan Harian"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline">expand_more</span>
</div>
</div>
<!-- Deskripsi Singkat -->
<div class="relative">
<label class="block font-label-md text-label-md text-outline mb-base px-base">Deskripsi Singkat</label>
<textarea class="w-full p-md bg-surface-container-low rounded-xl font-body-lg text-body-lg text-on-surface focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all min-h-[100px] resize-none">Menyediakan kebutuhan harian keluarga dengan harga terjangkau.</textarea>
</div>
</div>
</div>
<!-- Kontak & Lokasi Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm">
<div class="flex items-center gap-sm mb-lg">
<div class="w-10 h-10 rounded-lg bg-secondary-fixed/30 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">distance</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Kontak &amp; Lokasi</h2>
</div>
<div class="space-y-md">
<!-- WhatsApp -->
<div class="relative">
<label class="block font-label-md text-label-md text-outline mb-base px-base">Nomor WhatsApp</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-outline font-body-lg">+62</span>
<input class="w-full h-14 pl-16 pr-md bg-surface-container-low rounded-xl font-body-lg text-body-lg text-on-surface focus:outline-none" type="tel" value="812-3456-7890"/>
</div>
</div>
<!-- Email -->
<div class="relative">
<label class="block font-label-md text-label-md text-outline mb-base px-base">Email Bisnis</label>
<input class="w-full h-14 px-md bg-surface-container-low rounded-xl font-body-lg text-body-lg text-on-surface focus:outline-none" type="email" value="kontak@tokoberkah.id"/>
</div>
<!-- Alamat -->
<div class="relative">
<label class="block font-label-md text-label-md text-outline mb-base px-base">Alamat Lengkap</label>
<textarea class="w-full p-md bg-surface-container-low rounded-xl font-body-lg text-body-lg text-on-surface focus:outline-none min-h-[80px] resize-none">Jl. Merdeka No. 123, Jakarta Selatan, DKI Jakarta</textarea>
</div>
<!-- Peta Preview -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-outline px-base">Lokasi di Peta</label>
<div class="w-full h-32 rounded-xl overflow-hidden relative shadow-inner" data-location="Jl. Merdeka No. 123, Jakarta Selatan" style="">
<div class="absolute inset-0 bg-surface-container-high animate-pulse" id="map-skeleton"></div>
<div class="absolute bottom-sm left-sm bg-surface/90 backdrop-blur-sm px-sm py-xs rounded-lg flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-primary">location_on</span>
<span class="font-label-md text-label-md text-on-surface">-6.2088, 106.8456</span>
</div>
</div>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-md pb-safe">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-label-lg text-label-lg shadow-md active:scale-[0.98] transition-all flex items-center justify-center gap-sm" id="saveBtn">
<span>Simpan Perubahan</span>
</button>
</div>
</div>
</div>
<script>
    // Micro-interaction for save button
    document.getElementById('saveBtn').addEventListener('click', function() {
        const btn = this;
        const originalContent = btn.innerHTML;
        
        btn.disabled = true;
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>';
        
        setTimeout(() => {
            btn.classList.replace('bg-primary', 'bg-tertiary');
            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> <span>Tersimpan!</span>';
            
            setTimeout(() => {
                btn.classList.replace('bg-tertiary', 'bg-primary');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        }, 800);
    });

    // Map skeleton clean up
    window.addEventListener('load', () => {
        const skeleton = document.getElementById('map-skeleton');
        if(skeleton) {
            setTimeout(() => {
                skeleton.style.opacity = '0';
                setTimeout(() => skeleton.remove(), 500);
            }, 1000);
        }
    });
</script></main></body></html>
