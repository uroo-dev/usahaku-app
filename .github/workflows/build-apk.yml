name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android NDK
        run: |
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          if [ ! -d "$NDK_DIR" ]; then
            SDKM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -f "$SDKM" ]; then
              SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)
            fi
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" "ndk;28.2.13676358"
          else
            echo "NDK 28.2.13676358 already installed."
          fi

      - name: Pub get
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/usahaku-release.jks
          STORE_FILE="$(pwd)/android/keystore/usahaku-release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyPassword=$KEYSTORE_KEY_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          storeFile=$STORE_FILE
          EOF

      - name: Analyze & Test
        run: |
          flutter analyze
          flutter test

      - name: Build release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk UsahaKu.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsahaKu.apk
          path: UsahaKu.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: UsahaKu ${{ github.ref_name }}
          files: UsahaKu.apk
