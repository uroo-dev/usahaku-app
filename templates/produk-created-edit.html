<button class="w-12 h-full flex items-center justify-center active:bg-surface-container transition-colors" onclick="adjustValue('stok-input', -1)">

</button>

</button>
</div>
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-background text-label-md text-on-surface-variant z-10">Stok Minimum</label>

<textarea class="w-full p-md rounded-xl bg-transparent border-2 border-outline-variant focus:border-primary focus:outline-none text-on-surface font-body-lg placeholder:text-outline resize-none" placeholder="Ceritakan detail produk Anda..." rows="3"></textarea>
</div>
</div>
<!-- Bottom Action Button -->
<div class="fixed bottom-20 inset-x-0 px-margin-mobile py-sm bg-surface/80 backdrop-blur-lg z-40">
<button class="w-full h-14 rounded-xl bg-primary text-on-primary font-label-lg flex items-center justify-center gap-sm shadow-lg active:scale-95 transition-transform" id="save-btn">
<span class="material-symbols-outlined">save</span>
<span>Simpan Produk</span>
</button>
</div>
<script>
    function adjustValue(id, delta) {
      const input = document.getElementById(id);
      let val = parseInt(input.value) || 0;
      val = Math.max(0, val + delta);
      input.value = val;
      
      // Haptic feedback simulation
      if (window.navigator.vibrate) window.navigator.vibrate(10);
    }

    function simulateUpload() {
      const preview = document.getElementById('image-preview');
      const placeholder = document.getElementById('placeholder-content');
      const container = document.getElementById('image-preview-container');
      
      container.classList.add('animate-pulse');
      
      setTimeout(() => {
        container.classList.remove('animate-pulse');
        placeholder.classList.add('hidden');
        preview.classList.remove('hidden');
        // Visual cue for success
        container.classList.add('ring-4', 'ring-primary/20');
      }, 800);
    }

    // Success state on save
    document.getElementById('save-btn').addEventListener('click', function() {
      const btn = this;
      const originalHtml = btn.innerHTML;
      
      btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Menyimpan...</span>';
      btn.classList.add('opacity-80');
      
      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Berhasil Disimpan!</span>';
        btn.classList.remove('bg-primary');
        btn.classList.add('bg-green-600');
        
        setTimeout(() => {
          btn.innerHTML = originalHtml;
          btn.classList.remove('bg-green-600', 'opacity-80');
          btn.classList.add('bg-primary');
        }, 2000);
      }, 1500);
    });
  </script>
