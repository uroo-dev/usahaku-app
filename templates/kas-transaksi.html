<script>
    function selectType(type) {
      const btnIn = document.getElementById('btn-cash-in');
      const btnOut = document.getElementById('btn-cash-out');
      
      if (type === 'in') {
        btnIn.classList.add('bg-green-50', 'border-green-500');
        btnIn.classList.remove('bg-surface-container-high', 'border-transparent');
        btnOut.classList.remove('bg-red-50', 'border-red-500');
        btnOut.classList.add('bg-surface-container-high', 'border-transparent');
      } else {
        btnOut.classList.add('bg-red-50', 'border-red-500');
        btnOut.classList.remove('bg-surface-container-high', 'border-transparent');
        btnIn.classList.remove('bg-green-50', 'border-green-500');
        btnIn.classList.add('bg-surface-container-high', 'border-transparent');
      }
    }

    // Default selection
    selectType('in');
  </script>
