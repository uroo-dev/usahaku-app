name: usahaku
description: "UsahaKu - Offline-first business management app for Indonesian UMKM"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.0
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  share_plus: ^13.3.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.24.0
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/usahaku_icon.png"
  web:
    generate: true
    image_path: "assets/icon/usahaku_icon.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/icon/usahaku_icon.png"